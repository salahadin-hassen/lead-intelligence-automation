[project]
name = "lead-intelligence-automation"
version = "0.1.0"
description = "Lead intake API: POST /leads stored in PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic[email]",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
